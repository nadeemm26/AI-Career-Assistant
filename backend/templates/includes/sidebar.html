<aside class="col-md-3 col-lg-2 sidebar">

    <div class="sidebar-content">

        <div class="sidebar-heading">
            <span class="sidebar-heading-text">
                MAIN MENU
            </span>
        </div>

        <ul class="nav nav-pills flex-column sidebar-menu">

            <li class="nav-item">

                <a
                    class="nav-link
                    {% if request.resolver_match.url_name == 'dashboard' %}
                        active
                    {% endif %}"
                    href="{% url 'dashboard' %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-grid-1x2-fill"></i>
                    </span>

                    <span>Dashboard</span>

                </a>

            </li>

            <li class="nav-item">

                <a
                    class="nav-link
                    {% if request.resolver_match.url_name == 'resume_list' or request.resolver_match.url_name == 'upload_resume' %}
                        active
                    {% endif %}"
                    href="{% url 'resume:resume_list' %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-file-earmark-person-fill"></i>
                    </span>

                    <span>My Resumes</span>

                </a>

            </li>

            <li class="nav-item">

    <a
        class="nav-link {% if request.resolver_match.app_name == 'ats' %}active{% endif %}"
        href="{% url 'ats:analysis_list' %}"
    >

        <span class="menu-icon">
            <i class="bi bi-graph-up-arrow"></i>
        </span>

        <span>ATS Analysis</span>

    </a>

</li>

            <li class="nav-item">

                <a
                    class="nav-link
                    {% if request.resolver_match.url_name == 'job_roles' %}
                        active
                    {% endif %}"
                    href="{% url 'job_roles' %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-briefcase-fill"></i>
                    </span>

                    <span>Job Roles</span>

                </a>

            </li>

            <li class="nav-item">

                <a
                    class="nav-link
                    {% if request.resolver_match.url_name == 'courses' %}
                        active
                    {% endif %}"
                    href="{% url 'courses' %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-mortarboard-fill"></i>
                    </span>

                    <span>Courses</span>

                </a>

            </li>

            <li class="nav-item">

                <a
                    class="nav-link
                    {% if request.resolver_match.url_name == 'reports' %}
                        active
                    {% endif %}"
                    href="{% url 'reports' %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-file-earmark-bar-graph-fill"></i>
                    </span>

                    <span>Reports</span>

                </a>

            </li>

        </ul>

        <div class="sidebar-heading account-heading">

            <span class="sidebar-heading-text">
                ACCOUNT
            </span>

        </div>

        <ul class="nav nav-pills flex-column sidebar-menu">

            <li class="nav-item">

                <a
                    class="nav-link
                    {% if request.resolver_match.url_name == 'profile' %}
                        active
                    {% endif %}"
                    href="{% url 'profile' %}"
                >

                    <span class="menu-icon">
                        <i class="bi bi-person-circle"></i>
                    </span>

                    <span>Profile</span>

                </a>

            </li>

            <li class="nav-item">

                <form
                    method="POST"
                    action="{% url 'logout' %}"
                    class="logout-form"
                >

                    {% csrf_token %}

                    <button
                        type="submit"
                        class="nav-link logout-button"
                    >

                        <span class="menu-icon">
                            <i class="bi bi-box-arrow-right"></i>
                        </span>

                        <span>Logout</span>

                    </button>

                </form>

            </li>

        </ul>

    </div>

</aside>
