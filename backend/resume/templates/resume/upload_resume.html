{% extends "base.html" %}

{% block title %}Upload Resume{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow">

        <div class="card-header">

            <h3>Upload Resume</h3>

        </div>

        <div class="card-body">

            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary">
                    Upload Resume
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
